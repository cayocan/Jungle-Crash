name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-games:
    name: Unit Tests — games
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/games

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run unit tests
        run: bun test tests/unit

  test-wallets:
    name: Unit Tests — wallets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wallets

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run unit tests
        run: bun test tests/unit

  build-frontend:
    name: Build — frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Copy env example
        run: cp .env.example .env

      - name: Build
        run: bun run build
